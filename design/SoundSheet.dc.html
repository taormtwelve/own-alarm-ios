<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #FFB03A; } a:hover { color: #FFC670; }
    .num { font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B0A09; color: #F7F3EE; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 100px; flex-shrink: 0; padding: 52px 20px 0 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; opacity: 0.32;">
    <div class="num" style="font-size: 26px; font-weight: 600; letter-spacing: -0.025em; color: #8A8279;">Morning run</div>
  </div>

  <div style="flex-grow: 1; background: #171513; border-top: 1px solid #2A2724; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; padding: 10px 20px 28px 20px; box-sizing: border-box; gap: 16px;">

    <div style="display: flex; justify-content: center; flex-shrink: 0;">
      <span style="width: 38px; height: 5px; border-radius: 3px; background: #3A3530;"></span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div class="num" style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em;">Sound &amp; loudness</div>
        <div style="font-size: 13px; color: #8A8279;">Morning run &middot; 85%</div>
      </div>
      <span style="font-size: 15px; font-weight: 700; color: #FFB03A;">Done</span>
    </div>


    <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6E665F; flex-shrink: 0;">Alarm tones</div>

    <div style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;">

      <div style="display: flex; align-items: center; gap: 13px; padding: 9px 14px; background: #241C12; border: 1px solid #3A2C18; border-radius: 16px;">
        <div style="width: 38px; height: 38px; border-radius: 12px; background: #FFB03A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12100E" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 600;">Siren</span>
          <span style="font-size: 12px; color: #9A928A;">Harsh &middot; peaks fast &middot; 3s loop</span>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB03A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"></path></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 9px 14px; background: #1C1917; border: 1px solid #2A2724; border-radius: 16px;">
        <div style="width: 38px; height: 38px; border-radius: 12px; background: #2A2724; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9C0B7" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 600;">Marimba</span>
          <span style="font-size: 12px; color: #9A928A;">Warm &middot; even &middot; 6s loop</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 9px 14px; background: #1C1917; border: 1px solid #2A2724; border-radius: 16px;">
        <div style="width: 38px; height: 38px; border-radius: 12px; background: #2A2724; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9C0B7" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 600;">Soft bell</span>
          <span style="font-size: 12px; color: #9A928A;">Quiet &middot; long decay &middot; 8s loop</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 9px 14px; background: #1C1917; border: 1px solid #2A2724; border-radius: 16px;">
        <div style="width: 38px; height: 38px; border-radius: 12px; background: #2A2724; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9C0B7" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 600;">Whisper</span>
          <span style="font-size: 12px; color: #9A928A;">Barely there &middot; for night tasks</span>
        </div>
      </div>

      <div style="display: flex; gap: 8px;">
        <div style="flex-grow: 1; height: 62px; background: #1C1917; border: 1px dashed #3A3530; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C9C0B7" stroke-width="2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"></path></svg>
          <span style="font-size: 13px; font-weight: 600; color: #C9C0B7;">Music or Files</span>
        </div>
      </div>

    </div>

    <div style="flex-grow: 1;"></div>

    <div style="height: 56px; border-radius: 18px; background: #FFB03A; display: flex; align-items: center; justify-content: center; gap: 10px; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12100E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0112 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 004 0"></path></svg>
      <span style="font-size: 15px; font-weight: 700; color: #12100E;">Test real alarm at 85%</span>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
