<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #B0710A; } a:hover { color: #8A5708; }
    .num { font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; font-variant-numeric: tabular-nums; }
    @keyframes dcPulse { 0% { transform: scale(0.94); opacity: 0.55; } 70% { transform: scale(1.12); opacity: 0; } 100% { transform: scale(1.12); opacity: 0; } }
    .pulse { animation: dcPulse 2.6s ease-out infinite; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: radial-gradient(120% 62% at 50% 34%, #FFEFD4 0%, #FBF5EB 58%, #F5EFE5 100%); color: #1A1714; display: flex; flex-direction: column; align-items: center; overflow: hidden;">

  <div style="height: 72px; flex-shrink: 0;"></div>

  <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #E8940F;"></span>
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #9A6A0C;">Alarm ringing</span>
  </div>

  <div style="height: 34px; flex-shrink: 0;"></div>

  <div style="position: relative; width: 288px; height: 288px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
    <div class="pulse" style="position: absolute; width: 288px; height: 288px; border-radius: 50%; border: 1px solid #E8940F;"></div>
    <svg width="288" height="288" viewBox="0 0 288 288" style="position: absolute; transform: rotate(-90deg);">
      <circle cx="144" cy="144" r="128" fill="none" stroke="#EDE4D5" stroke-width="10"></circle>
      <circle cx="144" cy="144" r="128" fill="none" stroke="#E8940F" stroke-width="10" stroke-linecap="round" stroke-dasharray="684 120"></circle>
    </svg>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 210px; text-align: center;">
      <div class="num" style="font-size: 17px; font-weight: 600; color: #9A6A0C; letter-spacing: 0.01em;">06:45</div>
      <div style="font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.12; text-wrap: balance;">Morning run</div>
      <div style="display: flex; align-items: flex-end; gap: 3px; height: 18px;">
        <span style="width: 4px; height: 7px; border-radius: 2px; background: #E8940F;"></span>
        <span style="width: 4px; height: 11px; border-radius: 2px; background: #E8940F;"></span>
        <span style="width: 4px; height: 16px; border-radius: 2px; background: #E8940F;"></span>
        <span style="width: 4px; height: 9px; border-radius: 2px; background: #E8940F;"></span>
        <span style="width: 4px; height: 18px; border-radius: 2px; background: #E8940F;"></span>
        <span style="width: 4px; height: 13px; border-radius: 2px; background: #E8940F;"></span>
        <span style="width: 4px; height: 7px; border-radius: 2px; background: #E8940F;"></span>
      </div>
    </div>
  </div>

  <div style="height: 26px; flex-shrink: 0;"></div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: #FFF4E0; border: 1px solid #F0DFC0; border-radius: 999px; flex-shrink: 0;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B0710A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"></path><path d="M16 9.2a4 4 0 010 5.6"></path><path d="M18.8 6.6a7.6 7.6 0 010 10.8"></path></svg>
    <span class="num" style="font-size: 14px; font-weight: 600; color: #B0710A;">85%</span>
    <span style="width: 3px; height: 3px; border-radius: 50%; background: #D9BE88;"></span>
    <span style="font-size: 13px; color: #4A443C;">Siren, at full task volume</span>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="width: 100%; padding: 0 24px 44px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; flex-shrink: 0;">
    <div style="height: 64px; border-radius: 22px; background: #E8940F; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#23201C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="3"></rect></svg>
      <span style="font-size: 17px; font-weight: 700; color: #23201C; letter-spacing: -0.01em;">Stop</span>
    </div>
    <div style="height: 58px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E8E1D6; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <span style="font-size: 16px; font-weight: 600; color: #4A443C;">Snooze 9 min</span>
      <span style="font-size: 13px; color: #7D746A;">&middot; returns at 95%</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
