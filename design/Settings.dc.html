<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #FFB03A; } a:hover { color: #FFC670; }
    .num { font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #12100E; color: #F7F3EE; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 56px; flex-shrink: 0;"></div>

  <div style="padding: 0 20px 16px 20px; flex-shrink: 0;">
    <div class="num" style="font-size: 30px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.15;">Settings</div>
  </div>

  <div style="padding: 0 20px 10px 20px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6E665F; flex-shrink: 0;">Clock</div>

  <div style="margin: 0 20px; background: #1C1917; border: 1px solid #2A2724; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;">
    <span style="font-size: 15px; color: #C9C0B7;">Time format</span>
    <div style="background: #171513; border-radius: 14px; padding: 4px; display: flex; gap: 4px;">
      <div style="flex-grow: 1; height: 36px; border-radius: 11px; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 13px; font-weight: 500; color: #8A8279;">24-hour</span>
      </div>
      <div style="flex-grow: 1; height: 36px; border-radius: 11px; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 13px; font-weight: 500; color: #8A8279;">AM / PM</span>
      </div>
      <div style="flex-grow: 1; height: 36px; border-radius: 11px; background: #332D28; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 13px; font-weight: 600;">Match device</span>
      </div>
    </div>
  </div>

  <div style="padding: 18px 20px 10px 20px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6E665F; flex-shrink: 0;">When an alarm rings</div>

  <div style="margin: 0 20px; background: #1C1917; border: 1px solid #2A2724; border-radius: 20px; display: flex; flex-direction: column; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 10px 16px; box-sizing: border-box; border-bottom: 1px solid #262220;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; color: #C9C0B7;">Show on Lock Screen</span>
        <span style="font-size: 12px; color: #8A8279;">Off, the alarm only takes over inside the app</span>
      </div>
      <div style="width: 51px; height: 31px; border-radius: 16px; background: #FFB03A; display: flex; align-items: center; justify-content: flex-end; padding: 2px; box-sizing: border-box; flex-shrink: 0;">
        <span style="width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF;"></span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 10px 16px; box-sizing: border-box;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; color: #C9C0B7;">Alarms permission</span>
        <span style="font-size: 12px; color: #8A8279;">What lets an alarm ring through Silent</span>
      </div>
      <span style="font-size: 15px; font-weight: 600; color: #FFB03A;">Allowed</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F574F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </div>
  </div>

  <div style="padding: 18px 20px 10px 20px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6E665F; flex-shrink: 0;">Appearance</div>

  <div style="margin: 0 20px; background: #1C1917; border: 1px solid #2A2724; border-radius: 20px; padding: 6px; display: flex; gap: 6px; flex-shrink: 0;">
    <div style="flex-grow: 1; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 14px; font-weight: 500; color: #8A8279;">Dark</span>
    </div>
    <div style="flex-grow: 1; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 14px; font-weight: 500; color: #8A8279;">Light</span>
    </div>
    <div style="flex-grow: 1; height: 40px; border-radius: 14px; background: #332D28; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 14px; font-weight: 600;">Auto</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="flex-shrink: 0; display: flex; align-items: flex-start; justify-content: space-around; padding: 11px 24px 0 24px; border-top: 1px solid #221F1D; background: #171513; height: 80px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 64px; padding-top: 3px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E665F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"></circle><path d="M12 10v3.5l2.3 1.5"></path><path d="M4.6 4.8L7.2 2.6M19.4 4.8L16.8 2.6"></path></svg>
      <span style="font-size: 10px; font-weight: 600; color: #6E665F;">Alarms</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 64px; padding-top: 3px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E665F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4M8 7v10M12 4.5v15M16 8v8M20 11v2"></path></svg>
      <span style="font-size: 10px; font-weight: 600; color: #6E665F;">Sounds</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 64px; padding-top: 3px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFB03A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3.2v2.2M12 18.6v2.2M20.8 12h-2.2M5.4 12H3.2M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6M18.2 18.2l-1.6-1.6M7.4 7.4L5.8 5.8"></path></svg>
      <span style="font-size: 10px; font-weight: 600; color: #FFB03A;">Settings</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
