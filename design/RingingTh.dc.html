<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', 'Noto Sans Thai', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #FFB03A; } a:hover { color: #FFC670; }
    .num { font-family: 'Bricolage Grotesque', 'Noto Sans Thai', 'Helvetica Neue', sans-serif; font-variant-numeric: tabular-nums; }
    @keyframes dcPulse { 0% { transform: scale(0.94); opacity: 0.55; } 70% { transform: scale(1.12); opacity: 0; } 100% { transform: scale(1.12); opacity: 0; } }
    .pulse { animation: dcPulse 2.6s ease-out infinite; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: radial-gradient(120% 62% at 50% 34%, #2A1C0C 0%, #16110C 58%, #0D0B09 100%); color: #F7F3EE; display: flex; flex-direction: column; align-items: center; overflow: hidden;">

  <div style="height: 72px; flex-shrink: 0;"></div>

  <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #FFB03A;"></span>
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #C79A55;">นาฬิกากำลังปลุก</span>
  </div>

  <div style="height: 34px; flex-shrink: 0;"></div>

  <div style="position: relative; width: 288px; height: 288px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
    <div class="pulse" style="position: absolute; width: 288px; height: 288px; border-radius: 50%; border: 1px solid #FFB03A;"></div>
    <svg width="288" height="288" viewBox="0 0 288 288" style="position: absolute; transform: rotate(-90deg);">
      <circle cx="144" cy="144" r="128" fill="none" stroke="#2E2519" stroke-width="10"></circle>
      <circle cx="144" cy="144" r="128" fill="none" stroke="#FFB03A" stroke-width="10" stroke-linecap="round" stroke-dasharray="684 120"></circle>
    </svg>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 210px; text-align: center;">
      <div class="num" style="font-size: 17px; font-weight: 600; color: #C79A55; letter-spacing: 0.01em;">06:45</div>
      <div style="font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.12; text-wrap: balance;">วิ่งตอนเช้า</div>
    </div>
  </div>

  <div style="height: 26px; flex-shrink: 0;"></div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: #1E1913; border: 1px solid #332812; border-radius: 999px; flex-shrink: 0;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFB03A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"></path><path d="M16 9.2a4 4 0 010 5.6"></path><path d="M18.8 6.6a7.6 7.6 0 010 10.8"></path></svg>
    <span class="num" style="font-size: 14px; font-weight: 600; color: #FFB03A;">85%</span>
    <span style="width: 3px; height: 3px; border-radius: 50%; background: #5F4A28;"></span>
    <span style="font-size: 13px; color: #C9C0B7;">ไซเรน &middot; ตามระดับเสียงของการปลุกนี้</span>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="width: 100%; padding: 0 24px 44px 24px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 20px; flex-shrink: 0;">

    <div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 22px; border-radius: 999px; background: #1C1917; border: 1px solid #2A2724;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9C0B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h7l-7 8h7"></path><path d="M13 4h6l-6 7h6"></path></svg>
      <span style="font-size: 15px; font-weight: 600; color: #C9C0B7;">เลื่อนปลุก 9 นาที</span>
    </div>

    <div style="width: 100%; height: 64px; border-radius: 999px; background: #241C12; border: 1px solid #3A2C18; box-sizing: border-box; display: flex; align-items: center; padding: 0 4px;">
      <div style="width: 54px; height: 54px; border-radius: 50%; background: #FFB03A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#12100E"><rect x="6" y="6" width="12" height="12" rx="2.5"></rect></svg>
      </div>
      <span style="flex-grow: 1; text-align: center; padding-right: 54px; font-size: 16px; font-weight: 600; color: #FFB03A;">ปัดเพื่อหยุด</span>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
