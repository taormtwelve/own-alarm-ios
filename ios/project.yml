# XcodeGen spec.
#
# This exists so nobody needs a Mac to *create* the Xcode project. The macOS build
# runner generates `OwnAlarm.xcodeproj` from this file on every build, which means
# the project file is never committed and never drifts.
#
#   brew install xcodegen && xcodegen generate

name: OwnAlarm

options:
  bundleIdPrefix: com.ownalarm
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone and iPad — the layouts adapt, so there is no reason to exclude tablets.
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_STRICT_CONCURRENCY: minimal

# An explicit shared scheme. Without one in `xcshareddata`, `xcodebuild -scheme`
# cannot find anything to build on a freshly generated project.
schemes:
  OwnAlarm:
    build:
      targets:
        OwnAlarm: all
        OwnAlarmTests: [test]
        OwnAlarmUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - OwnAlarmTests
        - OwnAlarmUITests
    archive:
      config: Release

targets:
  OwnAlarm:
    type: application
    platform: iOS

    sources:
      - path: OwnAlarm
        excludes:
          - "**/.DS_Store"

    dependencies:
      # Draws AlarmKit's snooze countdown on the Lock Screen and in the Dynamic Island.
      - target: OwnAlarmWidgets

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ownalarm.app
        PRODUCT_NAME: OwnAlarm
        # Single 1024px source; Xcode derives every home-screen size from it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Left blank on purpose: CI builds unsigned, and Sideloadly re-signs with
        # your own Apple ID afterwards.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual

    info:
      path: OwnAlarm/Info.plist
      properties:
        CFBundleDisplayName: OwnAlarm
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Keeps a foreground alarm ringing if the screen locks mid-alarm.
        UIBackgroundModes:
          - audio
        NSUserNotificationsUsageDescription: >-
          OwnAlarm uses notifications to ring your alarms at the volume you set for
          each task, even when the app is closed.
        # AlarmKit (iOS 26+): real alarms on the Lock Screen that ring through Silent.
        NSAlarmKitUsageDescription: >-
          OwnAlarm rings your alarms on the Lock Screen and through Silent mode,
          each at the volume you set for its task.
        # The snooze countdown is a Live Activity.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false

  # The snooze countdown's Live Activity (iOS 26+, AlarmKit). A separate process, so
  # it shares OwnAlarmMetadata with the app through OwnAlarm/Shared.
  OwnAlarmWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - OwnAlarmWidgets
      - OwnAlarm/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ownalarm.app.widgets
        PRODUCT_NAME: OwnAlarmWidgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
    info:
      path: OwnAlarmWidgets/Info.plist
      properties:
        CFBundleDisplayName: OwnAlarm
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Unit tests: the store's behaviour against a spy scheduler, and the notification
  # content where per-task volume actually lives.
  OwnAlarmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OwnAlarmTests
    dependencies:
      - target: OwnAlarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ownalarm.app.tests
        GENERATE_INFOPLIST_FILE: YES

  # UI tests: drives the real app in the Simulator.
  OwnAlarmUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OwnAlarmUITests
    dependencies:
      - target: OwnAlarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ownalarm.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OwnAlarm
