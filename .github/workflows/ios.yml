name: Build OwnAlarm

# Two pipelines in one file:
#   dev  — every push: model tests, device build, unit + UI tests, .ipa artifact.
#   prod — the same, then a GitHub Release with the .ipa attached. Merging dev into
#          prod is the deploy, and nothing is released unless every test passed.
#
# The .ipa is UNSIGNED — you sign it on your own machine with your own Apple ID (see
# ios/BUILD.md), which keeps certificates out of this repository.

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to dev makes the older run pointless — cancel it and save macOS
# minutes, which bill at a multiple. Deploys to prod are never cancelled mid-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  core-tests:
    name: Model tests
    runs-on: ubuntu-latest
    # The official Swift image rather than a marketplace action: one less moving
    # part, and it cannot 404 looking for a toolchain.
    container: swift:5.9
    steps:
      - uses: actions/checkout@v5
      - name: Run the platform-independent suite
        run: swift test --package-path ios

  app:
    name: Build unsigned .ipa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Versions
        run: |
          xcodebuild -version
          echo "--- available simulators ---"
          xcrun simctl list devices available | head -40

      # AlarmKit — what makes alarms ring on the Lock Screen — ships in the iOS 26
      # SDK. The code compiles without it (guarded by canImport), so an older Xcode
      # would silently build an app that only posts notifications. Pick the newest
      # Xcode on the runner and say so loudly if it is still too old.
      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::warning::iOS SDK $SDK has no AlarmKit; Lock Screen ringing will be compiled out"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Show what was generated
        working-directory: ios
        run: |
          xcodebuild -list -project OwnAlarm.xcodeproj
          echo "--- shared schemes on disk ---"
          ls -la OwnAlarm.xcodeproj/xcshareddata/xcschemes/ || echo "none"

      # Unsigned: no certificates, no provisioning profiles, nothing secret in CI.
      # Output is captured so the compiler errors can be lifted into the run summary
      # instead of hiding behind an exit code.
      - name: Build for device
        id: build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project OwnAlarm.xcodeproj \
            -scheme OwnAlarm \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log

      # Runs even when the build failed — this is the step that tells us why.
      - name: Report errors
        if: always()
        working-directory: ios
        run: |
          {
            echo "## xcodebuild"
            echo '```'
            grep -E "error:|warning: .*(deprecated|unused)|\*\* BUILD" xcodebuild.log \
              | head -60 || echo "(no error lines matched)"
            echo '```'
            echo "<details><summary>last 80 lines</summary>"
            echo '```'
            tail -80 xcodebuild.log
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          retention-days: 7

      # An .ipa is just a zip with the .app inside a folder called Payload.
      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OwnAlarm.app Payload/
          zip -qry OwnAlarm-unsigned.ipa Payload
          ls -lh OwnAlarm-unsigned.ipa

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: OwnAlarm-unsigned-ipa
          path: ios/OwnAlarm-unsigned.ipa
          retention-days: 30

      # Runner images change their simulator line-up, so the device is discovered
      # rather than named — pinning to "iPhone 15" is how this broke before.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS"))
                      | .value[] | select(.isAvailable and (.name | contains("iPhone")))]
                     | last | .udid // empty')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      # Unit tests and UI tests. This also compiles for the Simulator, so it covers
      # what the old build-only step did.
      - name: Test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project OwnAlarm.xcodeproj \
            -scheme OwnAlarm \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-test \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee xcodebuild-test.log

      - name: Report test results
        if: always()
        working-directory: ios
        run: |
          {
            echo "## Tests"
            echo '```'
            grep -E "Test Suite .* (passed|failed)|error:|XCTAssert|\*\* TEST" \
              xcodebuild-test.log | head -60 || echo "(no result lines matched)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            ios/xcodebuild-test.log
            ios/TestResults.xcresult
          retention-days: 7

  # The deploy. Only for pushes to prod, and only once both jobs above — model
  # tests, device build, unit and UI tests — have passed.
  release:
    name: Deploy to GitHub Releases
    needs: [core-tests, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: OwnAlarm-unsigned-ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          FILE="OwnAlarm-${TAG}-unsigned.ipa"
          mv OwnAlarm-unsigned.ipa "$FILE"
          gh release create "$TAG" "$FILE" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "OwnAlarm ${TAG}" \
            --notes "Deployed from prod at ${{ github.sha }}. Unsigned: install with Sideloadly using your own Apple ID (see ios/BUILD.md)."
          echo "Released $FILE as $TAG" >> "$GITHUB_STEP_SUMMARY"
