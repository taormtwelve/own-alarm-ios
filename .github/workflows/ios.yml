name: Build OwnAlarm

# Runs only for prod. Merging dev into prod is the deploy, and nothing is released
# unless every test passed. Pushes to dev build nothing.
#
# Three jobs run side by side, so a deploy waits only for the slowest of them:
#   core-tests  (Linux)  model tests, no Apple SDK needed
#   ipa         (macOS)  the Release build of the unsigned .ipa
#   app-tests   (macOS)  unit and UI tests in the Simulator
# `release` publishes the .ipa once all three have passed.
#
# The .ipa is UNSIGNED — you sign it on your own machine with your own Apple ID (see
# ios/BUILD.md), which keeps certificates out of this repository.

on:
  push:
    branches: [prod]
  # Manual runs from the Actions tab, on any branch, when you want one.
  workflow_dispatch:

permissions:
  contents: read

# A newer run makes an older one pointless — cancel it and save macOS minutes,
# which bill at a multiple. Deploys to prod are never cancelled mid-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

env:
  # Homebrew's self-update takes longer than the one install it precedes.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  core-tests:
    name: Model tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The official Swift image rather than a marketplace action: one less moving
    # part, and it cannot 404 looking for a toolchain.
    container: swift:5.9
    steps:
      - uses: actions/checkout@v5
      - name: Run the platform-independent suite
        run: swift test --package-path ios

  ipa:
    name: Build .ipa
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # AlarmKit — what makes alarms ring on the Lock Screen — ships in the iOS 26
      # SDK. The code compiles without it (guarded by canImport), so an older Xcode
      # would silently build an app that only posts notifications. Pick the newest
      # Xcode on the runner and say so loudly if it is still too old.
      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::warning::iOS SDK $SDK has no AlarmKit; Lock Screen ringing will be compiled out"
          fi

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      # Unsigned: no certificates, no provisioning profiles, nothing secret in CI.
      # Indexing is for editors, not CI, so it is switched off.
      - name: Build for device
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project OwnAlarm.xcodeproj \
            -scheme OwnAlarm \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log

      # Only on failure: lifts the compiler errors into the run summary.
      - name: Report errors
        if: failure()
        working-directory: ios
        run: |
          {
            echo "## xcodebuild"
            echo '```'
            grep -E "error:|\*\* BUILD" xcodebuild.log | head -60 || echo "(no error lines matched)"
            echo '```'
            echo "<details><summary>last 80 lines</summary>"
            echo '```'
            tail -80 xcodebuild.log
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          retention-days: 7

      # An .ipa is just a zip with the .app inside a folder called Payload.
      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OwnAlarm.app Payload/
          zip -qry OwnAlarm-unsigned.ipa Payload
          ls -lh OwnAlarm-unsigned.ipa

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: OwnAlarm-unsigned-ipa
          path: ios/OwnAlarm-unsigned.ipa
          retention-days: 30

  app-tests:
    name: Unit and UI tests
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      # Runner images change their simulator line-up, so the device is discovered
      # rather than named. It is booted now, so it finishes starting up while the
      # tests compile instead of after.
      - name: Pick and boot a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS"))
                      | .value[] | select(.isAvailable and (.name | contains("iPhone")))]
                     | last | .udid // empty')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
          xcrun simctl boot "$UDID" || true

      - name: Test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project OwnAlarm.xcodeproj \
            -scheme OwnAlarm \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-test \
            -resultBundlePath TestResults.xcresult \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild-test.log

      - name: Report test results
        if: always()
        working-directory: ios
        run: |
          {
            echo "## Tests"
            echo '```'
            grep -E "Test Suite .* (passed|failed)|error:|\*\* TEST" \
              xcodebuild-test.log | head -60 || echo "(no result lines matched)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The result bundle carries UI-test screenshots and runs to hundreds of MB.
      # Uploading it on every green run was pure waiting; now only failures do.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            ios/xcodebuild-test.log
            ios/TestResults.xcresult
          retention-days: 7

  # The deploy. Only for pushes to prod, and only once every job above has passed.
  release:
    name: Deploy to GitHub Releases
    needs: [core-tests, ipa, app-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: OwnAlarm-unsigned-ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          FILE="OwnAlarm-${TAG}-unsigned.ipa"
          mv OwnAlarm-unsigned.ipa "$FILE"
          gh release create "$TAG" "$FILE" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "OwnAlarm ${TAG}" \
            --notes "Deployed from prod at ${{ github.sha }}. Unsigned: install with Sideloadly using your own Apple ID (see ios/BUILD.md)."
          echo "Released $FILE as $TAG" >> "$GITHUB_STEP_SUMMARY"
